name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Test the selected toolchain rather than silently downloading a newer one.
  GOTOOLCHAIN: local

jobs:
  test:
    name: Go ${{ matrix.go }} / ${{ matrix.platform.runner }} / ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GOARCH: ${{ matrix.platform.arch }}
      CGO_ENABLED: ${{ matrix.platform.arch == '386' && '0' || '1' }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23', '1.26', '1.27']
        platform:
          - {runner: ubuntu-latest, arch: amd64}
          - {runner: windows-latest, arch: amd64}
          - {runner: macos-latest, arch: arm64}
        include:
          - go: '1.27'
            platform: {runner: ubuntu-24.04-arm, arch: arm64}
          - go: '1.27'
            platform: {runner: ubuntu-latest, arch: '386'}
          - go: '1.27'
            platform: {runner: windows-latest, arch: '386'}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
          cache-dependency-path: go.mod

      - name: Toolchain details
        run: |
          go version
          go env GOOS GOARCH GOAMD64 GOARM64 CGO_ENABLED

      - name: Download modules
        run: |
          go mod download
          go mod verify

      - name: Vet
        run: go vet ./...

      # Exercise normal compiler intrinsics as well as the race-instrumented path.
      - name: Repeated native tests
        run: go test -count=20 -shuffle=on -cpu=1,2,4,8 -timeout=10m ./...

      - name: Native concurrency stress
        if: ${{ !cancelled() }}
        run: go test -run=Concurrent -count=100 -shuffle=on -cpu=1,2,4,8 -timeout=15m ./...

      - name: Native tests without optional CPU features
        if: ${{ !cancelled() }}
        env:
          GODEBUG: cpu.all=off
        run: go test -count=5 -shuffle=on -cpu=1,2,4,8 -timeout=10m ./...

      - name: Strict pointer checks
        if: ${{ !cancelled() }}
        run: go test -gcflags=all=-d=checkptr=2 -count=1 -shuffle=on -timeout=10m ./...

      # sync/atomic supplies the race-instrumented operations.
      - name: Repeated race tests
        if: ${{ !cancelled() && matrix.platform.arch != '386' }}
        env:
          GORACE: halt_on_error=1
        run: go test -race -count=5 -shuffle=on -cpu=1,2,4,8 -timeout=15m ./...

  cross-compile:
    name: Link / ${{ matrix.os }} / ${{ matrix.arch }} ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      GOARM: ${{ matrix.goarm || '7' }}
      GOARM64: ${{ matrix.goarm64 || 'v8.0' }}
      GOAMD64: ${{ matrix.goamd64 || 'v1' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: '386'}
          - {os: linux, arch: amd64}
          - {os: linux, arch: amd64, goamd64: v3, variant: v3}
          - {os: linux, arch: amd64, goamd64: v4, variant: v4}
          - {os: linux, arch: arm, goarm: '5', variant: v5}
          - {os: linux, arch: arm, goarm: '6', variant: v6}
          - {os: linux, arch: arm, goarm: '7', variant: v7}
          - {os: freebsd, arch: arm, goarm: '7', variant: v7}
          - {os: linux, arch: arm64, goarm64: v8.0, variant: v8.0}
          - {os: linux, arch: arm64, goarm64: v8.1, variant: v8.1-lse}
          - {os: linux, arch: loong64}
          - {os: linux, arch: mips}
          - {os: linux, arch: mipsle}
          - {os: linux, arch: mips64}
          - {os: linux, arch: mips64le}
          - {os: linux, arch: ppc64}
          - {os: linux, arch: ppc64le}
          - {os: linux, arch: riscv64}
          - {os: linux, arch: s390x}
          - {os: js, arch: wasm}
          - {os: wasip1, arch: wasm}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
          cache: true
          cache-dependency-path: go.mod

      - name: Toolchain details
        run: |
          go version
          go env GOOS GOARCH GOAMD64 GOARM GOARM64

      # Link test binaries to verify the complete target-specific dependency chain.
      - name: Compile and link every test package
        run: |
          mkdir -p "$RUNNER_TEMP/atom-tests"
          packages=$(go list ./...)
          for package in $packages; do
            go test -c -o "$RUNNER_TEMP/atom-tests/${package//\//_}.test" "$package"
          done

  wasm:
    name: Execute / js / wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
      GOOS: js
      GOARCH: wasm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
          cache: true
          cache-dependency-path: go.mod

      - name: Toolchain details
        run: |
          go version
          node --version

      - name: Repeated WebAssembly tests
        run: |
          export PATH="$(go env GOROOT)/lib/wasm:$PATH"
          go test -count=10 -shuffle=on -timeout=10m ./...

      - name: WebAssembly concurrency stress
        if: ${{ !cancelled() }}
        run: |
          export PATH="$(go env GOROOT)/lib/wasm:$PATH"
          go test -run=Concurrent -count=50 -shuffle=on -timeout=10m ./...
